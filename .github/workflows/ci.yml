name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile scripts/build_story.py scripts/create_demo_report.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Regenerate demo
        run: python scripts/create_demo_report.py
      - name: Verify generated demo is committed
        run: git diff --exit-code -- examples/demo-report

